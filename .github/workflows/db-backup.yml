# Nightly backup of the website/builder Supabase database (project xjtnbpqmkobyqfhdknhm).
# Needed before moving that project to the Supabase Free plan, which has no automatic
# backups. Requires the repository secret SUPABASE_DB_URL = the "Session pooler"
# connection string (Supabase → Project Settings → Database → Connection string),
# password included. Dumps are kept as private workflow artifacts for 30 days.
name: db-backup

on:
  schedule:
    - cron: '30 2 * * *'   # every night at 02:30 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "Secret SUPABASE_DB_URL is missing"; exit 1; }
          STAMP=$(date -u +%Y-%m-%d)
          # GitHub runners have no IPv6: a "direct connection" string (db.<ref>.supabase.co,
          # IPv6-only) is rewritten to the IPv4 session pooler of the same project.
          if [[ "$DB_URL" =~ ^postgres(ql)?://([^:]+):(.+)@db\.([a-z0-9]+)\.supabase\.co(:[0-9]+)?/([^?]+) ]]; then
            PASS="${BASH_REMATCH[3]}"; REF="${BASH_REMATCH[4]}"; DBN="${BASH_REMATCH[6]}"
            for H in aws-0-eu-west-1 aws-1-eu-west-1; do
              CAND="postgresql://postgres.$REF:$PASS@$H.pooler.supabase.com:5432/$DBN"
              if /usr/lib/postgresql/17/bin/psql "$CAND" -Atc 'select 1' >/dev/null 2>&1; then DB_URL="$CAND"; echo "Using session pooler $H"; break; fi
            done
          fi
          # Data + schema of the app schemas; Supabase-managed internals are excluded.
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --schema=backups \
            --file="factulista-site-$STAMP.dump"
          ls -lh factulista-site-$STAMP.dump
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Store backup (private artifact, 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: factulista-site-db-${{ env.STAMP }}
          path: factulista-site-*.dump
          retention-days: 30
